name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - obsidian
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clone quartz
        run: git clone https://github.com/jackyzha0/quartz.git ../quartz
      - name: configure logo
        run: sed -i "s/pageTitle:\ \"Quartz 4\"/pageTitle:\ \"Knowledge Base\"/g" ../quartz/quartz.config.ts
      - name: configure base url
        run: sed -i "s/baseUrl:\ \".*\"/baseUrl:\ \"eniverz.github.io\/notes\"/g" ../quartz/quartz.config.ts
      - name: configure graph view
        run: sed -i "s/Component\.Graph()/Component.Graph({globalGraph:{showTags:true,fontSize:1.5},localGraph:{showTags:false,fontSize:1.5}})/g" ../quartz/quartz.layout.ts
      - name: setup content
        run: cp -r ./ ../quartz/content
      - name: Install Dependencies
        run: cd ../quartz && npm ci
      - name: Build Quartz
        run: cd ../quartz && npx quartz build
      - name: test
        run: ls ../quartz/public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../quartz/public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
